apiVersion: v1
kind: Service
metadata:
  name: longhorn-manager-metrics
  namespace: longhorn-system
  labels: { app: longhorn-manager }
spec:
  clusterIP: None
  selector:
    app: longhorn-manager
  ports:
    - name: metrics
      port: 9500
      targetPort: 9500
---
# Longhorn-Chart-NetPol (longhorn-manager, restrictInternalTraffic) erlaubt nur
# Longhorn-interne Sender. Additive NetPol, damit Prometheus den Metrics-Port
# (9500) scrape-n kann.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-prometheus
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ops-monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9500
