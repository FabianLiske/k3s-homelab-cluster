apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-100
  namespace: flux-system
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  # The MetalLB pools (infrastructure/configs/metallb) are only applied after
  # this HelmRelease is Ready (infra-controllers -> infra-configs dependsOn
  # chain), so install/upgrade must not wait for the LoadBalancer IP.
  install:
    createNamespace: true
    disableWait: true
  upgrade:
    disableWait: true
  targetNamespace: ingress-100
  values:
    controller:
      kind: DaemonSet
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "media"
          effect: "NoSchedule"
      ingressClassResource:
        name: nginx-admin
        controllerValue: "k8s.io/ingress-nginx-admin"
      ingressClass: nginx-admin
      ingressClassByName: true
      watchIngressWithoutClass: false
      service:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        loadBalancerIP: 172.26.100.151
        annotations:
          metallb.io/address-pool: pool-vlan100-admin
      publishService:
        enabled: true
      config:
        use-forwarded-headers: "false"
      metrics:
        enabled: true
      extraArgs:
        metrics-per-host: "false"