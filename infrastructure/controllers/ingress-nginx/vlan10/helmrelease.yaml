apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-10
  namespace: flux-system
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: ingress-nginx
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  install:
    createNamespace: true
  targetNamespace: ingress-10
  values:
    controller:
      kind: DaemonSet
      nodeSelector:
        kubernetes.io/os: linux
        node.rohrbom.be/edge: "true"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "media"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "edge"
          effect: "NoSchedule"
      ingressClassResource:
        name: nginx-mon
        controllerValue: "k8s.io/ingress-nginx-mon"
      ingressClass: nginx-mon
      ingressClassByName: true
      watchIngressWithoutClass: false
      service:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        loadBalancerIP: 172.26.10.151
        annotations:
          metallb.universe.tf/address-pool: pool-vlan10-mon
      publishService:
        enabled: true
      config:
        use-forwarded-headers: "false"
      metrics:
        enabled: true
      extraArgs:
        metrics-per-host: "false"