apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-10
  namespace: flux-system
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  # The MetalLB pools (infrastructure/configs/metallb) are only applied after
  # this HelmRelease is Ready (infra-controllers -> infra-configs dependsOn
  # chain), so install/upgrade must not wait for the LoadBalancer IP.
  install:
    createNamespace: true
    disableWait: true
  upgrade:
    disableWait: true
  targetNamespace: ingress-10
  values:
    controller:
      kind: DaemonSet
      nodeSelector:
        kubernetes.io/os: linux
        node.rohrbom.be/edge: "true"
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "edge"
          effect: "NoSchedule"
      ingressClassResource:
        name: nginx-mon
        controllerValue: "k8s.io/ingress-nginx-mon"
      ingressClass: nginx-mon
      ingressClassByName: true
      watchIngressWithoutClass: false
      service:
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: 172.26.10.151
        annotations:
          metallb.io/address-pool: pool-vlan10-mon
      publishService:
        enabled: true
      config:
        use-forwarded-headers: "false"
      metrics:
        enabled: true
      extraArgs:
        metrics-per-host: "false"