apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 5m
  timeout: 10m
  targetNamespace: keda
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: keda
      version: "2.20.2"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
