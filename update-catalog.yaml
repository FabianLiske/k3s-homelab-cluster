    sources:
    - notes:busybox
    - release:calibre
    workflow: check_images
    on_error: record_and_continue; never develop or repair a scanner
    source_order: exact_configured_tag_metadata_or_HEAD_first_for_mutable_tags; bounded_version_sources_only_when_needed
