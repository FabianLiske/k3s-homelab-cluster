# Verbindliche Quellen für den Update-Checker. Details: docs/cluster-update-catalog.md
schema_version: 1
status: approved_for_checker
description: 'Verbindlicher Prüfkatalog für Hermes Daily Cluster Update Check (18e7f87d24fa): feste Reihenfolge,
  geprüfte Quellen, fertige Leseabfragen und sofortige gesperrte Tickets.'
policy:
  unknown_components: report_and_skip
  current_versions: read_from_manifests_and_cluster
  source_errors: record_and_continue
  source_discovery: no_unlisted_fallbacks
  write_scanner_code: false
  max_attempts_per_source: 2
  progress: Append one short JSON event per completed/deferred component. Never regenerate the entire journal/checkpoint,
    previous results or previous tickets.
  tickets: create_blocked_immediately_after_each_verified_service_update
  updates: require_explicit_user_approval
  image_policy: preserve_image_publisher_variant_and_existing_release_channel
  major_versions: separate_review_with_migration_plan
  deduplicate_registry_requests: true
  source_review: All configured version/release sources and all 51 checkable image tag endpoints were fetched successfully
    on 2026-11-04T21:29:53.703044+01:00. Commands and source ownership are fixed; no source discovery or scanner
    development during daily checks.
  classification: 'category: application, custom_image, platform, cluster; management describes check/external/bundled
    separately'
  allowed_lookup_tools:
  - provided read_commands using existing curl, jq, sed, awk and kubectl
  - direct read of listed release-note URLs with existing web/browser tools; no web searches
  forbidden_daily_work:
  - Do not create, modify, debug or install scanners, Python/JS/shell helper scripts, parsers, packages or registry
    clients.
  - Do not enumerate all registry tags, paginate an entire registry, clone upstream repositories or pull full images.
  - Do not search for alternative projects, registries or mirrors. Only use the URLs and explicit templates in this
    file.
  - Do not re-run a full inventory/scan because one component failed. Save its error and move on.
  source_limits:
    http_timeout_seconds: 20
    connect_timeout_seconds: 5
    max_pages_per_source: 1
    max_candidate_tags_per_image: 2
    max_http_requests_per_image: 6
    on_401_403_429: record_source_error_and_continue_without_retry
    on_timeout_or_5xx: at_most_one_retry; no component or run wall-clock deadline
    missing_version_in_bounded_response: report_not_verifiable_and_continue; never walk historical releases/tags
  context_limits: Read this catalog once. Keep the current component and its referenced source records. Reuse each
    source response within a run. Output only selected version/digest/date fields; fetch detailed release notes
    only for an actual candidate. Persist a result/ticket after each component.
  mutable_image_check: Check only the configured tag (e.g. latest, 17 or alpine), not every tag. Prefer the listed
    exact-tag metadata endpoint or HEAD. Compare digests of the same OS/architecture or the same manifest-index
    type. A changed digest verifies an update without reverse-searching historical versions. Resolve a single index/config
    only when required; never build a scanner.
  source_order: 'For mutable/channel tags, read exactly that configured tag: Docker Hub exact-tag JSON metadata
    where listed, otherwise manifest HEAD. Only immutable/versioned targets that need a newer version use a bounded
    tag list or release feed. Read changelogs only for detected update candidates.'
  execution_mode: 'Strictly sequential: one component at a time and at most one tool call per assistant turn. No
    subagents, parallel tool batches, concurrent commands or background processes.'
  component_order: Use check_order sequentially after excluding components with open tickets and already completed
    results of an unfinished cycle. Preserve original result times.
  completion_gate: Once a verified update has its blocked ticket ID, append a short result event and move to the
    NEXT COMPONENT. No further images from that component while its ticket is open. On board failure append pending_ticket
    and end with a partial report.
  journal_path: /home/faba/.hermes/cron/state/cluster-update-check/events.jsonl
  run_time_limit: none; no run/component wall-clock deadline. Keep individual HTTP/kubectl timeouts and bounded
    requests.
  reasoning: Cron job reasoning_effort=low; dedicated custom:cluster-update-check provider passes chat_template_kwargs.reasoning_effort=low
    through LiteLLM to Qwen. No global model changes.
  skip_open_tickets: Before any image/registry/release lookup, skip the whole component if ANY task for its component_id
    in cluster-updates is not done or archived. Includes blocked, ready, running and review. No new-version hunting
    or ticket expansion while a task is open.
  component_gate: Use the compact open-ticket recipe at startup and refresh it for the current component. After
    creating the first new blocked ticket, defer remaining images of that component until the task is closed.
  output_limits:
    ticket_title_chars: 110
    ticket_body_chars: 1200
    journal_event_chars: 400
    report_lines: 20
    reasoning: brief; no repeated plans, long self-explanations or speculation
catalog_access:
  instruction: 'Read policy and recipes once. At startup use read_commands.open_update_tasks (compact metadata,
    no ticket bodies). For one component set update_component_id and run component_context_command: fresh open-task
    gate followed by its small catalog entry. Open task: skip sources immediately. Never repeatedly read the full
    catalog.'
  routine_ids_command: 'awk ''/^- id: / { id=substr($0,7) } /^  update_track: routine$/ { print id }'' update-catalog.yaml'
  component_command: 'awk -v wanted="${update_component_id}" ''$0 == "- id: " wanted { selected=1 } selected &&
    /^- id: / && $0 != "- id: " wanted { exit } selected && /^[^ -]/ { exit } selected { print }'' update-catalog.yaml'
  source_record_command: awk -v wanted="${update_record_id}" '$0 == "  " wanted ":" { selected=1; print; next }
    selected && /^  [^ ]/ { exit } selected && /^[^ ]/ { exit } selected { print }' update-catalog.yaml
  source_record_parameter: update_record_id is an exact key from sources (e.g. release:home-assistant) or image_sources
    (e.g. docker.io/library/postgres).
  check_order_command: sed -n "/^check_order:/,/^[^ -]/p" update-catalog.yaml
  component_context_command: 'hermes kanban --board cluster-updates list --json | jq --arg component_id "${update_component_id}"
    ''[.[] | select(.status != "done" and .status != "archived") | {id,status,component_id: ((try (.idempotency_key
    // "" | capture("^cluster-update:(?<component>[^:]+):").component) catch null) // (try (.body // "" | capture("(?m)^component_id:
    *(?<component>[^\r\n ]+)").component) catch null) // (try (.body // "" | capture("(?m)^- Komponente: *(?<component>[^
    (\\r\\n]+)").component) catch null) // null), title}] | map(select(.component_id == $component_id))'' && awk
    -v wanted="${update_component_id}" ''$0 == "- id: " wanted { selected=1 } selected && /^- id: / && $0 != "-
    id: " wanted { exit } selected && /^[^ -]/ { exit } selected { print }'' update-catalog.yaml'
lookup_recipes:
  github_feed: Set update_source_url to sources[id].url and use its read_recipe from read_commands. GitHub feeds
    need neither an API key nor API quota. Version tags are the final release-link segment; display titles can differ.
  image_tags: Set update_source_url to image_sources[repository].tags_url, update_token_url when needed, then use
    tags_read_recipe. An optional Docker Hub prefix lookup may substitute the current tag family into the explicit
    URL template. No pagination.
  image_digest: Substitute only the tag/digest into manifest_url_template; put the complete URL in update_manifest_url.
    Set update_manifest_accept to manifest_accept below and update_token_url if present. Execute digest_read_recipe.
    Use manifest_read_recipe only when OS/architecture resolution is needed.
  manifest_accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json,
    application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json
  image_version_label: 'Only if needed: use the selected manifest config_digest in config_blob_url_template, set
    update_config_blob_url, then execute version_label_read_recipe. This reads config labels only; never fetch filesystem
    layers.'
  helm_index: Set update_source_url and update_chart_name from sources[chart:<component>], then use read_recipe
    helm_versions. Existing curl and awk return 10 chart versions/appVersions/digests. No YAML parser or installation
    required.
  k3s: Use release:k3s-channels to resolve the stable channel, then release:k3s for changes. Match current server
    and all kubelet versions; do not independently probe every bundled component.
  failure: A source failure ends only this component check. Persist component ID, URL, HTTP/error status and checked
    time; continue to the next component without implementation work.
  read_recipe_parameters: Each recipe is a ready-made shell command. Set its quoted update_* variables to literal
    values from this catalog or the selected image reference. Do not generate scripts or functions. Use shell pipefail
    so HTTP/parser failures remain visible; never print an anonymous token.
  daily_sequence:
  - At startup read compact open_update_tasks, then exclude every component with an open task BEFORE inventory/research.
    Select one remaining check_order component via component_context_command; it refreshes the board gate. No source
    calls for skipped components.
  - Read only its image_sources records or chart/version sources. Current tags and digests come from the repo and
    the one live inventory, not a fresh whole-cluster scan per service.
  - 'For latest or another tracked channel, check only that exact tag: exact_tag_url_template/exact_tag_read_recipe
    where present, otherwise digest_read_recipe (HEAD). Do not list tags first. For versioned images that need a
    newer target, use the bounded listed tag source or release feed while preserving publisher, major and flavor.'
  - If unchanged, persist the result and go to the next component without fetching upstream changelogs. If changed,
    fetch only the listed release notes relevant to that candidate and assess it.
  - On first verified update, immediately create a blocked ticket (body <=1200 characters), append ONE result event,
    then move to the next COMPONENT. Defer any remaining images of this component until its open task is done/archived.
    Unchanged/no-update results append one short event, never the whole state.
  exact_tag: Substitute the actual configured tag into exact_tag_url_template, set update_source_url, then execute
    exact_tag_read_recipe. Docker Hub JSON includes per-platform digests; this avoids both manifest GETs and listing
    unrelated tags. For other registries use HEAD via image_digest. Never replace a pinned database major/channel
    with global latest.
  dockerhub_rate_limits: Official Docker documentation says GET manifest requests count toward the pull limit while
    HEAD does not. Other request/abuse limits can still apply. Use exact-tag metadata or HEAD first; do not repeatedly
    GET manifests or retry HTTP 429. https://docs.docker.com/docker-hub/usage/pulls/
  live_inventory: Run the three cluster_*_snapshot commands once at startup, sequentially, with output paths under
    the run data directory. Read filtered records for the current namespace/resource only; do not print the full
    snapshot or start a new whole-cluster inventory per service. Snapshots contain no environment values or secret
    bodies.
  progress: 'Use journal_summary once, then journal_append with a SINGLE one-line JSON object in update_event_json
    (<=400 characters). Events: cycle_start (cycle_id,at,catalog_sha256), result (cycle_id,at,component_id,status,ticket_ids),
    pending_ticket (cycle_id,at,component_id,source_ref,target), cycle_end (cycle_id,at). Tickets hold full details;
    results are never copied into the journal. No full-file rewrite.'
  open_ticket_gate: 'Open means any state except done/archived. Match canonical component_id from idempotency_key
    prefix cluster-update:<id>: or body marker component_id: <id>. An unknown mapping requires reading that card
    once; never silently ignore it. While ANY task is open, skip every image and dependency of that component. The
    board is authoritative; a stale local journal cannot remove this gate. The current Hermes CLI omits idempotency_key
    in list JSON; its full body is filtered locally for component_id: or legacy - Komponente: markers, never printed
    to model context.'
read_commands:
  github_atom_summary: curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0
    "${update_source_url}" | sed -n -E '/^[[:space:]]*<(title|updated)>/p; /^[[:space:]]*<link[^>]*href="https:\/\/github\.com\/[^\"]*\/releases\/tag\//p'
  postgres_rss_summary: curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0
    "${update_source_url}" | sed 's/></>\n</g' | sed -n -E '/^[[:space:]]*<(title|link|pubDate)>/p'
  gitlab_tags: 'curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0 "${update_source_url}"
    | jq ''[.[] | {name, released_at: .commit.committed_date, release}]'''
  k3s_stable_channel: curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0 "${update_source_url}"
    | jq '[.data[] | select(.name == "stable") | {name, latest}]'
  helm_versions: curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0 "${update_source_url}"
    | awk -v chart="${update_chart_name}" '$0 == "  " chart ":" { selected=1; next } selected && /^  [^ -]/ { selected=0
    } selected && /^    (appVersion|digest|version):/ && count < 30 { print; count++ }'
  dockerhub_tags: curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0 "${update_source_url}"
    | jq '[.results[] | {name, digest, last_updated}]'
  quay_tags: curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0 "${update_source_url}"
    | jq '[.tags[] | {name, manifest_digest, last_modified}]'
  oci_tags_public: curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0 "${update_source_url}"
    | jq '.tags[:50]'
  oci_tags_authenticated: 'update_lookup_token=$(curl --fail --silent --show-error --location --connect-timeout
    5 --max-time 20 --retry 0 "${update_token_url}" | jq -er ''.token // .access_token'') && curl --fail --silent
    --show-error --location --connect-timeout 5 --max-time 20 --retry 0 --header "Authorization: Bearer ${update_lookup_token}"
    "${update_source_url}" | jq ''.tags[:50]'''
  manifest_head_public: 'curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry
    0 --head --header "Accept: ${update_manifest_accept}" "${update_manifest_url}" | sed -n -E ''/^HTTP\//p; /^[Dd]ocker-[Cc]ontent-[Dd]igest:/p;
    /^[Cc]ontent-[Tt]ype:/p'''
  manifest_summary_public: 'curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry
    0 --header "Accept: ${update_manifest_accept}" "${update_manifest_url}" | jq ''{mediaType, config_digest: .config.digest,
    manifests: [.manifests[]? | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture
    == "arm64")) | {digest, platform}]}'''
  image_version_labels_public: 'curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry
    0 --header "Accept: ${update_manifest_accept}" "${update_config_blob_url}" | jq ''{version: .config.Labels["org.opencontainers.image.version"],
    revision: .config.Labels["org.opencontainers.image.revision"], source: .config.Labels["org.opencontainers.image.source"]}'''
  manifest_head_authenticated: 'update_lookup_token=$(curl --fail --silent --show-error --location --connect-timeout
    5 --max-time 20 --retry 0 "${update_token_url}" | jq -er ''.token // .access_token'') && curl --fail --silent
    --show-error --location --connect-timeout 5 --max-time 20 --retry 0 --head --header "Authorization: Bearer ${update_lookup_token}"
    --header "Accept: ${update_manifest_accept}" "${update_manifest_url}" | sed -n -E ''/^HTTP\//p; /^[Dd]ocker-[Cc]ontent-[Dd]igest:/p;
    /^[Cc]ontent-[Tt]ype:/p'''
  manifest_summary_authenticated: 'update_lookup_token=$(curl --fail --silent --show-error --location --connect-timeout
    5 --max-time 20 --retry 0 "${update_token_url}" | jq -er ''.token // .access_token'') && curl --fail --silent
    --show-error --location --connect-timeout 5 --max-time 20 --retry 0 --header "Authorization: Bearer ${update_lookup_token}"
    --header "Accept: ${update_manifest_accept}" "${update_manifest_url}" | jq ''{mediaType, config_digest: .config.digest,
    manifests: [.manifests[]? | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture
    == "arm64")) | {digest, platform}]}'''
  image_version_labels_authenticated: 'update_lookup_token=$(curl --fail --silent --show-error --location --connect-timeout
    5 --max-time 20 --retry 0 "${update_token_url}" | jq -er ''.token // .access_token'') && curl --fail --silent
    --show-error --location --connect-timeout 5 --max-time 20 --retry 0 --header "Authorization: Bearer ${update_lookup_token}"
    --header "Accept: ${update_manifest_accept}" "${update_config_blob_url}" | jq ''{version: .config.Labels["org.opencontainers.image.version"],
    revision: .config.Labels["org.opencontainers.image.revision"], source: .config.Labels["org.opencontainers.image.source"]}'''
  dockerhub_exact_tag: 'curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0
    "${update_source_url}" | jq ''{name, digest, last_updated, images: [.images[] | select(.os == "linux" and (.architecture
    == "amd64" or .architecture == "arm64")) | {architecture, os, digest}]}'''
  cluster_pods_snapshot: 'kubectl get pods -A --request-timeout=15s -o json | jq ''[.items[] | {namespace: .metadata.namespace,
    name: .metadata.name, node: .spec.nodeName, phase: .status.phase, owners: [.metadata.ownerReferences[]? | {kind,name}],
    containers: [(.spec.containers[]?, .spec.initContainers[]?) | {name,image}], statuses: [(.status.containerStatuses[]?,
    .status.initContainerStatuses[]?) | {name,image,imageID}]}]'' > "${update_pod_snapshot}"'
  cluster_nodes_snapshot: 'kubectl get nodes --request-timeout=15s -o json | jq ''[.items[] | {name: .metadata.name,
    architecture: .status.nodeInfo.architecture, kubelet_version: .status.nodeInfo.kubeletVersion}]'' > "${update_node_snapshot}"'
  cluster_workloads_snapshot: 'kubectl get deployments,statefulsets,daemonsets,cronjobs,helmreleases.helm.toolkit.fluxcd.io
    -A --request-timeout=15s -o json | jq ''[.items[] | {kind, namespace: .metadata.namespace, name: .metadata.name,
    replicas: .spec.replicas, suspend: .spec.suspend, chart_spec: .spec.chart.spec, target_namespace: .spec.targetNamespace,
    deployed_chart: (.status.history[0] // null | if . == null then null else {chartName,chartVersion,appVersion}
    end), images: [(.spec.template.spec.containers[]?, .spec.template.spec.initContainers[]?, .spec.jobTemplate.spec.template.spec.containers[]?,
    .spec.jobTemplate.spec.template.spec.initContainers[]?) | {name,image}]}]'' > "${update_workload_snapshot}"'
  open_update_tasks: 'hermes kanban --board cluster-updates list --json | jq ''[.[] | select(.status != "done" and
    .status != "archived") | {id,status,component_id: ((try (.idempotency_key // "" | capture("^cluster-update:(?<component>[^:]+):").component)
    catch null) // (try (.body // "" | capture("(?m)^component_id: *(?<component>[^\r\n ]+)").component) catch null)
    // (try (.body // "" | capture("(?m)^- Komponente: *(?<component>[^ (\\r\\n]+)").component) catch null) // null),
    title}]'''
  open_component_tasks: 'hermes kanban --board cluster-updates list --json | jq --arg component_id "${update_component_id}"
    ''[.[] | select(.status != "done" and .status != "archived") | {id,status,component_id: ((try (.idempotency_key
    // "" | capture("^cluster-update:(?<component>[^:]+):").component) catch null) // (try (.body // "" | capture("(?m)^component_id:
    *(?<component>[^\r\n ]+)").component) catch null) // (try (.body // "" | capture("(?m)^- Komponente: *(?<component>[^
    (\\r\\n]+)").component) catch null) // null), title}] | map(select(.component_id == $component_id))'''
  journal_append: '[ "${#update_event_json}" -le 400 ] && printf ''%s\n'' "${update_event_json}" | jq -e -c ''if
    type == "object" and (.event | type == "string") and (.cycle_id | type == "string") then . else error("invalid
    journal event") end'' >> "${update_journal_path}"'
  journal_summary: if [ -f "${update_journal_path}" ]; then jq -s '(. | map(select(.event == "cycle_start")) | last)
    as $start | if $start == null then {cycle:null,completed_components:[]} else [.[] | select(.cycle_id == $start.cycle_id)]
    as $events | ($events | [.[] | select(.event == "pending_ticket")] | last) as $pending | {cycle:$start, complete:($events
    | any(.event == "cycle_end")), completed_components:($events | [.[] | select(.event == "result") | .component_id]
    | unique), pending_ticket:(if $pending == null or ($events | any(.event == "result" and .component_id == $pending.component_id
    and .at >= $pending.at)) then null else $pending end)} end' "${update_journal_path}"; else printf '%s\n' '{"cycle":null,"completed_components":[]}';
    fi
