  management: check
  update_track: routine
  path: apps/internal/media/calibre
  images:
  - repository: docker.io/library/busybox
    manifests:
    - apps/internal/media/calibre/deployment.yaml
    source: image_sources[docker.io/library/busybox]
  - repository: ghcr.io/crocodilestick/calibre-web-automated
    manifests:
    - apps/internal/media/calibre/deployment.yaml
    source: image_sources[ghcr.io/crocodilestick/calibre-web-automated]
