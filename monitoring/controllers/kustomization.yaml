apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ./kube-state-metrics/
  - ./node-exporter/
  - ./pi-oled/
  - ./ping-exporter/
  - ./speedtest-exporter/
  - ./prometheus/
  - ./loki/
  - ./promtail/
  - ./influxdb/
  - ./telegraf/
  - ./unpoller/
  - ./grafana/
  - ./xpu-smi-exporter/

# Monitoring services that have been verified on arm64 should prefer the
# small workers, while retaining wk-4 as a capacity fallback.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(grafana|influxdb|kube-state-metrics|loki|ping-exporter|unpoller)$"
    path: prefer-small-workers.yaml
