apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ops-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # Prometheus selbst (UI) - Programm-/Handler-Metriken droppen
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === NODES: Node Exporter auf jeder Node ===
      - job_name: node-exporter
        static_configs:
          - targets:
              # Hinweis: Falls Hostnames im Pod nicht resolvbar sind, lieber IPs eintragen.
              - 'cp-1:9100'
              - 'cp-2:9100'
              - 'cp-3:9100'
              - 'wk-1:9100'
              - 'wk-2:9100'
              - 'wk-3:9100'
              - 'wk-4:9100'
              - 'wk-5:9100'
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === INGRESS: NGINX Controller Metrics ===
      - job_name: nginx-ingress
        static_configs:
          - targets:
              - 'ingress-10-ingress-10-ingress-nginx-controller-metrics.ingress-10.svc:10254'
              - 'ingress-20-ingress-20-ingress-nginx-controller-metrics.ingress-20.svc:10254'
              - 'ingress-30-ingress-30-ingress-nginx-controller-metrics.ingress-30.svc:10254'
              - 'ingress-100-ingress-100-ingress-nginx-controller-metrics.ingress-100.svc:10254'
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === CLUSTER HEALTH: API-Server (/metrics) ===
      - job_name: kubernetes-apiserver
        scheme: https
        static_configs:
          - targets: ['kubernetes.default.svc:443']
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === CLUSTER HEALTH: CoreDNS ===
      - job_name: coredns
        static_configs:
          - targets: ['kube-dns.kube-system.svc:9153']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === CLUSTER HEALTH: kube-state-metrics (Zustand/Verfügbarkeit) ===
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.ops-monitoring.svc:8080']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === STORAGE: Longhorn (DNS-SD via SRV) ===
      - job_name: longhorn
        dns_sd_configs:
          - names: ['_metrics._tcp.longhorn-manager-metrics.longhorn-system.svc']
            type: SRV
            refresh_interval: 1m
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === PING EXPORTER: Metrics ===
      - job_name: ping-exporter
        static_configs:
          - targets: ['ping-exporter.ops-monitoring.svc:9427']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === EXTERNAL: 172.26.107.130 Metrics ===
      - job_name: klima-display
        scrape_interval: 1m
        metrics_path: /metrics
        static_configs:
          - targets: ['172.26.107.130']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === SPEEDTEST EXPORTER: Metrics ===
      - job_name: speedtest
        scrape_interval: 5m
        scrape_timeout: 2m
        static_configs:
          - targets: ['speedtest-exporter.ops-monitoring.svc:9798']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === UNIFI: UniFi Poller / UnPoller ===
      - job_name: unifipoller
        scrape_interval: 30s
        static_configs:
          - targets: ['unpoller.ops-monitoring.svc:9130']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === LLM: vLLM Inference Metrics ===
      - job_name: vllm
        static_configs:
          - targets: ['vllm.svc-llm.svc:8000']
        metrics_path: /metrics
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*|python_.*|vllm:estimated_flops_.*_created|vllm:estimated_read_bytes_.*_created|vllm:estimated_write_bytes_.*_created|vllm:prefix_cache_queries_created)$'
            action: drop
      # === LLM: Text Embeddings Inference Metrics ===
      - job_name: embeddings
        static_configs:
          - targets: ['embeddings.svc-llm.svc:9000']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
      # === LLM: LiteLLM Proxy Metrics ===
      - job_name: litellm
        static_configs:
          - targets: ['litellm.svc-llm.svc:4000']
        metrics_path: /metrics
        authorization:
          type: Bearer
          credentials_file: /etc/litellm-credentials/LITELLM_METRICS_KEY
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
          # Hoch-kardinale Labels entfernen (client_ip, user_agent, user_email, end_user)
          - regex: 'client_ip|user_agent|user_email|end_user'
            action: labeldrop
      # === GPU: Intel XPU SMI Exporter (DNS-SD) ===
      - job_name: xpu-smi
        dns_sd_configs:
          - names: ['xpu-smi-exporter.ops-monitoring.svc']
            type: A
            port: 8080
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '^(go_.*|process_.*|promhttp_.*)$'
            action: drop
