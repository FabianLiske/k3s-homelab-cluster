apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xpu-smi-exporter
  namespace: ops-monitoring
  labels:
    app: xpu-smi-exporter
    app.kubernetes.io/part-of: monitoring
    gitops: flux
spec:
  selector:
    matchLabels:
      app: xpu-smi-exporter
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: xpu-smi-exporter
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        node.rohrbom.be/workload: llm
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
      containers:
        - name: xpu-smi-exporter
          image: intel/xpu-smi-exporter:latest
          imagePullPolicy: IfNotPresent
          args:
            - --xpu-smi.interval=15s
          ports:
            - name: metrics
              containerPort: 9108
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
