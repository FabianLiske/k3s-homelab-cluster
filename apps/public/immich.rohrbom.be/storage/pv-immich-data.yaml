apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-data-pv
  labels:
    app.kubernetes.io/part-of: immich
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 1Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: 172.26.60.223
    path: /mnt/fast/data/immich
