# Allow the LLM stack (LiteLLM MCP gateway) to reach Trilium in-cluster.
# The MCP endpoint (/mcp) requires an ETAPI bearer token, so this does not
# weaken the token-based protection — it only removes the dependency on
# the public ingress (internet) for the internal LiteLLM -> Trilium hop.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-trilium-from-llm
  namespace: svc-trilium
spec:
  podSelector:
    matchLabels:
      app: trilium
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: svc-llm
      ports:
        - { protocol: TCP, port: 8080 }
