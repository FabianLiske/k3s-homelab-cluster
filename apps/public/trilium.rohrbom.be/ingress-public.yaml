apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trilium
  namespace: svc-trilium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "2592000"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Only LiteLLM reaches MCP via the in-cluster service. Match NGINX's
    # normalized URI, including case variants, trailing slash and subpaths.
    # The public Trilium web UI stays available via the catch-all route.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($uri ~* "^/mcp(?:/|$)") { return 404; }
spec:
  ingressClassName: nginx-public
  rules:
    - host: trilium.rohrbom.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trilium-svc
                port:
                  number: 80
  tls:
    - hosts: [trilium.rohrbom.be]
      secretName: trilium-tls
