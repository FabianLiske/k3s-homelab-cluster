apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-service
  namespace: svc-rag
  labels:
    app: knowledge-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knowledge-service
  template:
    metadata:
      labels:
        app: knowledge-service
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # wk-4: heavy-compute-Node (lokal neben Qdrant und kb-sync)
      nodeSelector:
        node.rohrbom.be/heavy-compute: "true"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knowledge-service
          image: ghcr.io/fabianliske/k3s-homelab-cluster/knowledge-pipeline:511a5cdfd263efdf240ab13f04bdab2992730f46
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8000"
            - name: QDRANT_URL
              value: http://qdrant.svc-rag.svc.cluster.local:80
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-secret
                  key: api_key
            - name: QDRANT_COLLECTION
              value: kb
            - name: TRILIUM_URL
              value: http://trilium-svc.svc-trilium.svc.cluster.local:80
            - name: TRILIUM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knowledge-pipeline-secret
                  key: TRILIUM_TOKEN
            - name: EMBED_URL
              value: http://embeddings.svc-llm.svc.cluster.local:8080
            - name: EMBED_MODEL
              value: Qwen/Qwen3-Embedding-0.6B
            - name: KNOWLEDGE_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: knowledge-pipeline-secret
                  key: KNOWLEDGE_API_KEYS
            - name: KB_SYNC_ADMIN_URL
              value: http://kb-sync.svc-rag.svc.cluster.local:9101
            - name: LOG_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
