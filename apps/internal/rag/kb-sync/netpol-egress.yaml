apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kb-sync-egress
  namespace: svc-rag
spec:
  podSelector:
    matchLabels:
      app: kb-sync
  policyTypes: [Egress]
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Qdrant (gleicher Namespace, Pod-Level-Port 6333/6334)
    - to:
        - podSelector:
            matchLabels:
              app: qdrant
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
    # Docling-Serve (gleicher Namespace, Pod-Level-Port 5001)
    - to:
        - podSelector:
            matchLabels:
              app: docling-serve
      ports:
        - protocol: TCP
          port: 5001
    # Trilium ETAPI (Pod-Level-Port 8080)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: svc-trilium
          podSelector:
            matchLabels:
              app: trilium
      ports:
        - protocol: TCP
          port: 8080
    # Embeddings/TEI (Pod-Level-Port 8080)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: svc-llm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: embeddings
      ports:
        - protocol: TCP
          port: 8080
