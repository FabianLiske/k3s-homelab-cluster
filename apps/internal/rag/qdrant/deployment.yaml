apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: svc-rag
  labels:
    app: qdrant
spec:
  replicas: 1
  # RWO-PVC: kein RollingUpdate mit zwei Replikaten gleichzeitig
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        # wk-4 ist der heavy-compute-Node mit Longhorn; Qdrant bleibt dort
        # (wk-5 hat keinen Longhorn-CSI-Treiber, nur Local-PVs).
        node.rohrbom.be/heavy-compute: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.20.0
          imagePullPolicy: IfNotPresent
          env:
            - name: QDRANT__TELEMETRY_DISABLED
              value: "1"
            # API-Key-Authentifizierung (Header "api-key" oder
            # "Authorization: Bearer <key>"). /healthz, /readyz, /livez und
            # der Web-UI-Pfad sind in v1.20.0 explicit von der Auth
            # ausgenommen (API-Key-Whitelist) — Probes brauchen keinen
            # Header, daher auch kein Header im Manifest.
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-secret
                  key: api_key
            # Snapshots unterhalb des Daten-Mounts: Der Standardpfad
            # /qdrant/snapshots liegt im Image ausserhalb von
            # /qdrant/storage und ist fuer UID 1000 nicht beschreibbar.
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/storage/snapshots
            # Temporare Pfade (u.a. hochgeladene Snapshots vor dem Restore)
            # ebenfalls auf den Daten-Mount legen.
            - name: QDRANT__STORAGE__TEMP_PATH
              value: /qdrant/storage/temp
            # Snapshot-Restore aus Remote-URLs abschalten: nur lokale
            # Dateien/Uploads. Mit aktivem API-Key waere das eine
            # SSRF-Flaechen, die im Homelab-Workflow nicht gebraucht wird.
            - name: QDRANT__SERVICE__ENABLE_SNAPSHOT_URL_RECOVERY
              value: "false"
          ports:
            - name: http
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP
          # /healthz ist in v1.20.0 auth-frei (whitelisted)
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
