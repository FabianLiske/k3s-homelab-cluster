apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-docling-serve-from-internal-ingress-and-stack
  namespace: svc-rag
spec:
  podSelector:
    matchLabels:
      app: docling-serve
  policyTypes: [Ingress]
  ingress:
    # UI/API via nginx-internal Ingress (VLAN 20)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-20
      ports:
        - protocol: TCP
          port: 5001
    # RAG-Stack-Komponenten (Ingestion) im selben Namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: svc-rag
      ports:
        - protocol: TCP
          port: 5001
