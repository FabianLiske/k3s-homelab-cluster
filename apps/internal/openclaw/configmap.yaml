apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: svc-openclaw
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "trustedProxies": [
          "10.42.0.0/16"
        ],
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": [
            "https://openclaw.intern.rohrbom.be"
          ]
        }
      },
      "models": {
        "mode": "replace",
        "providers": {
          "litellm": {
            "baseUrl": "http://litellm.svc-llm.svc.cluster.local:4000/v1",
            "apiKey": "${LITELLM_API_KEY}",
            "api": "openai-completions",
            "timeoutSeconds": 3600,
            "request": {
              "allowPrivateNetwork": true
            },
            "models": [
              {
                "id": "local-chat",
                "name": "Local GPT-OSS 20B",
                "reasoning": true,
                "input": [
                  "text"
                ],
                "cost": {
                  "input": 0,
                  "output": 0,
                  "cacheRead": 0,
                  "cacheWrite": 0
                },
                "contextWindow": 32768,
                "maxTokens": 8192
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "model": {
            "primary": "litellm/local-chat"
          },
          "utilityModel": "litellm/local-chat",
          "models": {
            "litellm/local-chat": {
              "alias": "Local"
            }
          },
          "modelPolicy": {
            "allow": [
              "litellm/local-chat"
            ]
          }
        },
        "entries": {
          "default": {
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        }
      },
      "cron": {
        "enabled": false
      }
    }
