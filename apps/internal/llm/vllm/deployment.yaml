apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  progressDeadlineSeconds: 7200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: inference
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/hostname: wk-5
        node.rohrbom.be/workload: llm
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
      containers:
        - name: vllm
          image: intel/llm-scaler-vllm:0.21.0-b3
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - serve
          args:
            - Qwen/Qwen3.6-27B-FP8
            - --served-model-name
            - local-chat
            - Qwen/Qwen3.6-27B-FP8
            - --host=0.0.0.0
            - --port=8000
            - --download-dir=/var/lib/llm/models
            - --revision=e89b16ebf1988b3d6befa7de50abc2d76f26eb09
            - --dtype=float16
            - --gpu-memory-utilization=0.95
            - --max-model-len=131072
            - --max-num-batched-tokens=8192
            - --max-num-seqs=1
            - --block-size=64
            - --tensor-parallel-size=2
            - --kv-cache-dtype=fp8_e4m3
            - --mamba-ssm-cache-dtype=float16
            - --enable-prefix-caching
            - --language-model-only
            - --enforce-eager
            - --trust-remote-code
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --reasoning-parser=qwen3
          env:
            - name: HF_HOME
              value: /var/lib/llm/cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /var/lib/llm/cache/vllm
            - name: TRITON_CACHE_DIR
              value: /var/lib/llm/cache/triton
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /var/lib/llm/cache/torchinductor
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
              value: "1"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: CCL_TOPO_P2P_ACCESS
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 720
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              gpu.intel.com/xe: "2"
            limits:
              cpu: "32"
              memory: 96Gi
              gpu.intel.com/xe: "2"
          volumeMounts:
            - name: llm-storage
              mountPath: /var/lib/llm
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: llm-storage
          persistentVolumeClaim:
            claimName: llm-storage
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
