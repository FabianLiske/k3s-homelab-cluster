apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm
  pollingInterval: 5
  initialCooldownPeriod: 1800
  cooldownPeriod: 1800
  minReplicaCount: 0
  maxReplicaCount: 1
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda.svc.cluster.local:9090
        interceptorRoute: vllm
