apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: docker.io/library/postgres:17
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - until pg_isready --host=open-webui-postgresql --username=openwebui --dbname=openwebui; do sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.1
          imagePullPolicy: IfNotPresent
          env:
            - name: WEBUI_URL
              value: https://chat.intern.rohrbom.be
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: http://litellm.svc-llm.svc.cluster.local:4000/v1
            - name: AIOHTTP_CLIENT_TIMEOUT
              value: "600"
            - name: AIOHTTP_CLIENT_STREAM_IDLE_TIMEOUT
              value: "600"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: OPENAI_API_KEY
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: WEBUI_SECRET_KEY
            - name: WEBUI_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: WEBUI_ADMIN_EMAIL
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: WEBUI_ADMIN_PASSWORD
            - name: WEBUI_ADMIN_NAME
              value: Admin
            - name: ENABLE_SIGNUP
              value: "false"
            # Keep the Git-managed web search settings authoritative over
            # values already stored in Open WebUI's PostgreSQL database.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: duckduckgo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://openwebui:$(POSTGRES_PASSWORD)@open-webui-postgresql:5432/openwebui
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
