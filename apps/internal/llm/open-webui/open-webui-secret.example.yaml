# Copy to open-webui-secret.yaml, replace every placeholder, then encrypt with:
#   sops --encrypt --in-place apps/internal/llm/open-webui/open-webui-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: open-webui-secrets
  namespace: svc-llm
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-your-litellm-virtual-key"
  WEBUI_SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  WEBUI_ADMIN_EMAIL: "admin@example.invalid"
  WEBUI_ADMIN_PASSWORD: "replace-with-a-strong-password"
  POSTGRES_PASSWORD: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
