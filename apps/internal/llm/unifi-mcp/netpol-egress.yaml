# Egress allowlist for unifi-mcp: DNS plus the UniFi Cloud Gateway only.
# No general internet egress (the MCP holds a privileged gateway API key).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifi-mcp-egress
  namespace: svc-llm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-mcp
  policyTypes: [Egress]
  egress:
    # DNS
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # UniFi Cloud Gateway (local network API)
    - to:
        - ipBlock:
            cidr: 172.26.1.1/32
      ports:
        - { protocol: TCP, port: 443 }
