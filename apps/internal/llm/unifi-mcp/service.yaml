# ClusterIP only: LiteLLM (same namespace) is the sole MCP client.
# No ingress by design (unifi-mcp design doc §25).
apiVersion: v1
kind: Service
metadata:
  name: unifi-mcp
  labels:
    app.kubernetes.io/name: unifi-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: unifi-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
