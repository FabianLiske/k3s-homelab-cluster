# Copy this file to litellm-database-secret.yaml and replace the example value.
#
# Recommended generation command (32 random bytes, encoded as URL-safe hex):
#   openssl rand -hex 32
#
# Encrypt after inserting the generated password:
#   sops --encrypt --in-place apps/internal/llm/litellm/litellm-database-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: litellm-database-secrets
  namespace: svc-llm
type: Opaque
stringData:
  POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
