apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: local-chat
        litellm_params:
          model: openai/local-chat
          api_base: http://vllm.svc-llm.svc.cluster.local:8000/v1
          api_key: not-needed
          use_chat_completions_api: true
        model_info:
          # Together AI serverless reference pricing for GPT-OSS 20B, USD/token.
          input_cost_per_token: 0.00000005
          output_cost_per_token: 0.00000020

      - model_name: local-embedding
        litellm_params:
          model: openai/local-embedding
          api_base: http://embeddings.svc-llm.svc.cluster.local:8080/v1
          api_key: not-needed
        model_info:
          mode: embedding

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL

    litellm_settings:
      drop_params: true
      set_verbose: false
