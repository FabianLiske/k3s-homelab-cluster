apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: local-chat
        litellm_params:
          model: openai/local-chat
          api_base: http://vllm.svc-llm.svc.cluster.local:8000/v1
          api_key: not-needed

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL

    litellm_settings:
      drop_params: true
      set_verbose: false
