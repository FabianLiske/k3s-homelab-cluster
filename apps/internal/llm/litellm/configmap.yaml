apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: local/qwen-3.8-27b
        litellm_params:
          # Public names identify the local model; upstream IDs stay independent.
          model: openai/Qwen/Qwen3.8-27B-FP8
          api_base: http://vllm.svc-llm.svc.cluster.local:8000/v1
          api_key: not-needed
          use_chat_completions_api: true
          presence_penalty: 0.5
        model_info:
          # TODO: reference pricing carried over from Qwen3.6-27B (checked 2026-09-04).
          # No confirmed SiliconFlow listing for Qwen3.8-27B yet; re-check and update.
          input_cost_per_token: 0.00000030
          output_cost_per_token: 0.00000320

      - model_name: local/qwen-3-embedding-0.6b
        litellm_params:
          model: openai/local-embedding
          api_base: http://embeddings.svc-llm.svc.cluster.local:8080/v1
          api_key: not-needed
        model_info:
          mode: embedding

      - model_name: external/jev-1.14
        litellm_params:
          # Decision model: call /v1/systemone or /v1/decisions.
          model: openrouter/typesafe/jev-1.14
          api_key: os.environ/OPENROUTER_API_KEY

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      # ingress-20 overwrites forwarding headers. Trust the edge node's
      # pod subnet, not all cluster pods or arbitrary private addresses.
      use_x_forwarded_for: true
      mcp_trusted_proxy_ranges:
        - "10.42.10.0/24"
      mcp_xff_num_trusted_hops: 1
      # Admin sign-in rate limiting uses this separate proxy allowlist.
      trusted_proxy_ranges:
        - "10.42.10.0/24"
      # MCP consumers are cluster workloads or clients on our routed LANs.
      mcp_internal_ip_ranges:
        - "10.42.0.0/16"
        - "172.26.0.0/16"
        - "127.0.0.0/8"
        - "::1/128"

    litellm_settings:
      drop_params: true
      set_verbose: false
      callbacks:
        - prometheus

    # Trilium's built-in MCP server, reached in-cluster via the ClusterIP
    # service (no internet dependency). Trilium requires an ETAPI bearer
    # token on every /mcp request; the token is injected as an env var
    # from trilium-mcp-secret (SOPS-encrypted).
    mcp_servers:
      # Preserve the generated IDs used before the v1.108.3 upgrade.
      # Existing virtual-key permissions reference these IDs; keep them stable.
      trilium:
        server_id: "3443536f864b3d65b442c264ce89fdb1"
        available_on_public_internet: false
        url: http://trilium-svc.svc-trilium.svc.cluster.local:80/mcp
        transport: "http"
        description: "Trilium knowledge base (in-cluster, Streamable HTTP)"
        auth_type: "bearer_token"
        auth_value: os.environ/TRILIUM_MCP_TOKEN
      # Read-only UniFi Network MCP server (own deployment in this namespace).
      # Bearer token is injected as env var from unifi-mcp-secret (SOPS-encrypted).
      unifi:
        server_id: "3181b9c1beb0e557065efba1b66fa71e"
        available_on_public_internet: false
        url: http://unifi-mcp.svc-llm.svc.cluster.local:8000/mcp
        transport: "http"
        description: "UniFi Network management and diagnostics (read-only)"
        auth_type: "bearer_token"
        auth_value: os.environ/UNIFI_MCP_TOKEN
      # Price-check MCP server (own deployment in this namespace; headless
      # Chromium scraping public shop sites). It has no token
      # authentication; access control is the ClusterIP-only service plus
      # the network policies (LiteLLM pods only). No auth_type/auth_value.
      pricecheck:
        server_id: "50b034efbad7bffc47c2aec18ef26397"
        available_on_public_internet: false
        url: http://pricecheck-mcp.svc-llm.svc.cluster.local:8000/mcp
        transport: "http"
        description: "Current product prices at configured online shops"
