apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: local-chat
        litellm_params:
          # Keep the LiteLLM alias stable while addressing Qwen explicitly.
          model: openai/Qwen/Qwen3.6-27B-FP8
          api_base: http://vllm.svc-llm.svc.cluster.local:8000/v1
          api_key: not-needed
          use_chat_completions_api: true
        model_info:
          # Cloud-equivalent reference pricing, checked 2026-09-04:
          # SiliconFlow Qwen3.6-27B: $0.30/M input, $3.20/M output.
          input_cost_per_token: 0.00000030
          output_cost_per_token: 0.00000320

      - model_name: local-embedding
        litellm_params:
          model: openai/local-embedding
          api_base: http://embeddings.svc-llm.svc.cluster.local:8080/v1
          api_key: not-needed
        model_info:
          mode: embedding

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL

    litellm_settings:
      drop_params: true
      set_verbose: false
      callbacks:
        - prometheus
