apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: local-chat
        litellm_params:
          # Keep the LiteLLM alias stable while addressing Qwen explicitly.
          model: openai/Qwen/Qwen3.8-27B-FP8
          api_base: http://vllm.svc-llm.svc.cluster.local:8000/v1
          api_key: not-needed
          use_chat_completions_api: true
        model_info:
          # TODO: reference pricing carried over from Qwen3.6-27B (checked 2026-09-04).
          # No confirmed SiliconFlow listing for Qwen3.8-27B yet; re-check and update.
          input_cost_per_token: 0.00000030
          output_cost_per_token: 0.00000320

      - model_name: local-embedding
        litellm_params:
          model: openai/local-embedding
          api_base: http://embeddings.svc-llm.svc.cluster.local:8080/v1
          api_key: not-needed
        model_info:
          mode: embedding

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL

    litellm_settings:
      drop_params: true
      set_verbose: false
      callbacks:
        - prometheus

    # Trilium's built-in MCP server, reached in-cluster via the ClusterIP
    # service (no internet dependency). Trilium requires an ETAPI bearer
    # token on every /mcp request; the token is injected as an env var
    # from trilium-mcp-secret (SOPS-encrypted).
    mcp_servers:
      trilium:
        server_id: "trilium"
        url: http://trilium-svc.svc-trilium.svc.cluster.local:80/mcp
        transport: "http"
        description: "Trilium knowledge base (in-cluster, Streamable HTTP)"
        auth_type: "bearer_token"
        auth_value: os.environ/TRILIUM_MCP_TOKEN
      # Read-only UniFi Network MCP server (own deployment in this namespace).
      # Bearer token is injected as env var from unifi-mcp-secret (SOPS-encrypted).
      unifi:
        server_id: "unifi"
        url: http://unifi-mcp.svc-llm.svc.cluster.local:8000/mcp
        transport: "http"
        description: "UniFi Network management and diagnostics (read-only)"
        auth_type: "bearer_token"
        auth_value: os.environ/UNIFI_MCP_TOKEN
