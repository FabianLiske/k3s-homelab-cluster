# Copy this file to trilium-mcp-secret.yaml and replace the placeholder.
#
# Required format:
#   <Trilium ETAPI token>  (created in Trilium under Options > ETAPI)
#
# The token is the credential LiteLLM uses to authenticate against the
# Trilium built-in MCP server (Authorization: Bearer <token>).
# Recommended: create a dedicated token for this purpose so it can be
# revoked independently.
#
# SOPS encryption after inserting the token:
#   sops --encrypt --in-place apps/internal/llm/litellm/trilium-mcp-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: trilium-mcp-secret
  namespace: svc-llm
type: Opaque
stringData:
  TRILIUM_MCP_TOKEN: REPLACE_WITH_TRILIUM_ETAPI_TOKEN
