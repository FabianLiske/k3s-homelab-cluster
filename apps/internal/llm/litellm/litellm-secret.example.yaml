# For a new installation, copy this file and replace the example values.
# For an existing installation, edit the real secret with sops and preserve
# LITELLM_MASTER_KEY when adding OPENROUTER_API_KEY.
#
# Required master key format:
#   sk-<random secret>
#
# Recommended generation command (32 random bytes, encoded as hex):
#   printf 'sk-%s\n' "$(openssl rand -hex 32)"
#
# Encrypt the real secret with SOPS before committing it:
#   sops --encrypt --in-place apps/internal/llm/litellm/litellm-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: svc-llm
type: Opaque
stringData:
  LITELLM_MASTER_KEY: sk-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  OPENROUTER_API_KEY: sk-or-v1-replace-with-your-openrouter-key
