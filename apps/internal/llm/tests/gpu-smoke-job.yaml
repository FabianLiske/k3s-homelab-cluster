# This Job is intentionally excluded from the Flux Kustomization.
# Apply it manually after the Intel GPU device plugin reports gpu.intel.com/xe: 1.
apiVersion: batch/v1
kind: Job
metadata:
  name: intel-xpu-smoke-test
  namespace: svc-llm
  labels:
    app.kubernetes.io/name: intel-xpu-smoke-test
    app.kubernetes.io/part-of: llm
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-xpu-smoke-test
    spec:
      restartPolicy: Never
      nodeSelector:
        node.rohrbom.be/workload: llm
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
      containers:
        - name: xpu-smoke-test
          image: vllm/vllm-openai-xpu:v0.28.0
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
          args:
            - |
              from pathlib import Path
              import os
              import torch

              storage_path = Path("/var/lib/llm")
              for directory in ("cache", "models", "artifacts"):
                  (storage_path / directory).mkdir(parents=True, exist_ok=True)

              probe_path = storage_path / ".kubernetes-write-test"
              probe_path.write_text("ok\n")
              probe_path.unlink()

              filesystem = os.statvfs(storage_path)
              free_gib = filesystem.f_bavail * filesystem.f_frsize / 1024**3
              print(f"storage_path={storage_path}")
              print(f"storage_free_gib={free_gib:.2f}")

              assert torch.xpu.is_available(), "Intel XPU is not available"
              assert torch.xpu.device_count() == 1, "Expected exactly one Intel XPU"

              device_name = torch.xpu.get_device_name(0)
              print(f"device_count={torch.xpu.device_count()}")
              print(f"device_name={device_name}")

              left = torch.rand((2048, 2048), device="xpu")
              right = torch.rand((2048, 2048), device="xpu")
              result = left @ right
              torch.xpu.synchronize()

              print(f"result_device={result.device}")
              print(f"result_shape={tuple(result.shape)}")
              print("Intel XPU smoke test passed")
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              gpu.intel.com/xe: "1"
            limits:
              cpu: "2"
              memory: 4Gi
              gpu.intel.com/xe: "1"
          volumeMounts:
            - name: llm-storage
              mountPath: /var/lib/llm
      volumes:
        - name: llm-storage
          persistentVolumeClaim:
            claimName: llm-storage
