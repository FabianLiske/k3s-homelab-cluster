# Allow only the LiteLLM gateway pod (same namespace) to reach
# pricecheck-mcp. Unlike the other MCP backends this endpoint has no
# token authentication, so this network policy is its only access
# control in front of the cluster boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pricecheck-mcp-from-llm
  namespace: svc-llm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pricecheck-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - { protocol: TCP, port: 8000 }
