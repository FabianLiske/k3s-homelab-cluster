# No secret: the price-check MCP holds no credentials, and its runtime
# settings (bind host/port, config dir) are baked into the image.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - netpol-ingress-llm.yaml
  - netpol-egress.yaml
