# Copy this file to bifrost-secret.yaml and replace the example values.
#
# Recommended generation commands:
#   BIFROST_ADMIN_PASSWORD:  openssl rand -hex 32
#   BIFROST_VK_EVAL:         printf 'sk-bf-%s\n' "$(openssl rand -hex 32)"
#
# Optional SOPS encryption after inserting the generated values:
#   sops --encrypt --in-place apps/internal/llm/bifrost/bifrost-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: bifrost-secrets
  namespace: svc-llm
type: Opaque
stringData:
  BIFROST_ADMIN_USERNAME: admin
  BIFROST_ADMIN_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  BIFROST_VK_EVAL: sk-bf-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
