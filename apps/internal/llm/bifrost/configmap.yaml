apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-config
data:
  config.json: |
    {
      "$schema": "https://www.getbifrost.ai/schema",
      "client": {
        "allowed_origins": ["*"],
        "drop_excess_requests": false,
        "enable_logging": false,
        "enforce_auth_on_inference": true,
        "initial_pool_size": 100,
        "max_request_body_size_mb": 100
      },
      "config_store": {
        "enabled": true,
        "type": "sqlite",
        "config": {
          "path": "/app/data/config.db"
        }
      },
      "logs_store": {
        "enabled": true,
        "type": "sqlite",
        "config": {
          "path": "/app/data/logs/logs.db"
        }
      },
      "governance": {
        "auth_config": {
          "is_enabled": true,
          "admin_username": "env.BIFROST_ADMIN_USERNAME",
          "admin_password": "env.BIFROST_ADMIN_PASSWORD"
        },
        "virtual_keys": [
          {
            "id": "sk-bf-eval-01",
            "name": "evaluation",
            "is_active": true,
            "value": "env.BIFROST_VK_EVAL",
            "provider_configs": [
              {
                "provider": "local-vllm",
                "key_ids": ["local-vllm-key-1"],
                "allowed_models": ["local-chat"],
                "weight": 1.0
              },
              {
                "provider": "tei",
                "key_ids": ["tei-key-1"],
                "allowed_models": ["local-embedding"],
                "weight": 1.0
              }
            ]
          }
        ]
      },
      "providers": {
        "local-vllm": {
          "keys": [
            {
              "id": "local-vllm-key-1",
              "name": "vllm-local",
              "value": "not-needed",
              "models": ["local-chat"],
              "weight": 1.0
            }
          ],
          "network_config": {
            "base_url": "http://vllm.svc-llm.svc.cluster.local:8000",
            "allow_private_network": true
          },
          "custom_provider_config": {
            "base_provider_type": "openai"
          }
        },
        "tei": {
          "keys": [
            {
              "id": "tei-key-1",
              "name": "tei-local",
              "value": "not-needed",
              "models": ["local-embedding"],
              "weight": 1.0
            }
          ],
          "network_config": {
            "base_url": "http://embeddings.svc-llm.svc.cluster.local:8080",
            "allow_private_network": true
          },
          "custom_provider_config": {
            "base_provider_type": "openai"
          }
        }
      }
    }
