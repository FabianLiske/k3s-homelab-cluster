apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  labels:
    app.kubernetes.io/name: bifrost
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost
  template:
    metadata:
      annotations:
        llm.rohrbom.be/config-revision: "bifrost-v2-1-1-eval-v4"
        llm.rohrbom.be/secret-revision: "2026-09-10-initial-1"
      labels:
        app.kubernetes.io/name: bifrost
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bifrost
          image: docker.io/maximhq/bifrost:v2.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_DIR
              value: /app/data
            - name: APP_PORT
              value: "8080"
            - name: APP_HOST
              value: 0.0.0.0
            - name: LOG_LEVEL
              value: info
            - name: LOG_STYLE
              value: json
            - name: BIFROST_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_ADMIN_USERNAME
            - name: BIFROST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_ADMIN_PASSWORD
            - name: BIFROST_VK_EVAL
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_VK_EVAL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/data/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: bifrost-config
