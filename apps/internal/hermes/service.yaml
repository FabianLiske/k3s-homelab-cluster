apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: svc-hermes
  labels:
    app: hermes
spec:
  type: ClusterIP
  selector:
    app: hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
      protocol: TCP
    - name: api
      port: 8642
      targetPort: api
      protocol: TCP
